name: Publish container (manual)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed git tag to build (for example v0.12.0)
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Validate tag and image name
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "IMAGE=ghcr.io/${REPOSITORY,,}:$RELEASE_TAG" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, smoke test and publish
        run: |
          docker build -t "$IMAGE" .
          docker run --rm "$IMAGE" --quickstart --cpu-only
          docker push "$IMAGE"
          docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" > image-digest.txt
      - uses: actions/upload-artifact@v6
        with:
          name: container-digest
          path: image-digest.txt
